<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Sprite visto desde ARRIBA y mirando a la DERECHA (ángulo 0).
       El juego lo gira hacia donde apunta el personaje. -->
  <!-- arma -->
  <rect x="38" y="28" width="20" height="8" rx="2" fill="#4a4a4a" stroke="#1e1e1e" stroke-width="2"/>
  <!-- cuerpo -->
  <circle cx="30" cy="32" r="20" fill="#3498db" stroke="#1e1e1e" stroke-width="3"/>
  <!-- pelo / parte de atrás de la cabeza -->
  <path d="M30 13.5 A18.5 18.5 0 0 0 30 50.5 A12 18.5 0 0 1 30 13.5 Z" fill="#1f5f8b"/>
  <path d="M26 13 Q38 16 40 22 L30 22 Z" fill="#1f4e79" stroke="#1e1e1e" stroke-width="1.5"/>
  <!-- ojos (miran hacia delante) -->
  <circle cx="35" cy="23" r="4.5" fill="white" stroke="#1e1e1e" stroke-width="1.5"/>
  <circle cx="36.5" cy="23" r="2.2" fill="#1e1e1e"/>
  <circle cx="35" cy="41" r="4.5" fill="white" stroke="#1e1e1e" stroke-width="1.5"/>
  <circle cx="36.5" cy="41" r="2.2" fill="#1e1e1e"/>
  
  <!-- manos sujetando el arma -->
  <circle cx="49" cy="28" r="4.5" fill="#f2c08f" stroke="#1e1e1e" stroke-width="2"/>
  <circle cx="49" cy="37" r="4.5" fill="#f2c08f" stroke="#1e1e1e" stroke-width="2"/>
</svg>
